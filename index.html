<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DPYMS v2 - Danish Health Care (P) Ltd.</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="root">
    <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0E2A5E;color:#fff;font-family:'Segoe UI',Arial,sans-serif;text-align:center;padding:24px;">
      <div style="width:60px;height:60px;border:4px solid rgba(255,255,255,0.2);border-top:4px solid #5FA8E0;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:24px;"></div>
      <h1 style="font-size:20px;font-weight:800;letter-spacing:1px;margin:0 0 8px;">DANISH HEALTH CARE (P) LTD.</h1>
      <p style="font-size:12px;color:rgba(255,255,255,0.65);text-transform:uppercase;letter-spacing:2px;margin:0 0 24px;">Digital Production Yield Management System</p>
      <p id="load-status" style="font-size:13px;color:#F59E0B;">Loading...</p>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
  </div>
  <script>
    window.onerror = function(msg, src, line) {
      var el = document.getElementById('load-status');
      if (el) { el.style.color='#F87171'; el.textContent='Error: '+msg+' (line '+line+')'; }
    };
  </script>
  <script src="app1.js"></script>
  <script src="app2.js"></script>
  <script src="app3.js"></script>
</body>
</html>
